# Render Blueprint cho agent Part 6.
# Tạo Blueprint với "Blueprint file path" = 06-lab-complete/render.yaml
services:
  - type: web
    name: ai-agent
    runtime: docker
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Secret: Render tự sinh, không ghi giá trị vào file
      - key: AGENT_API_KEY
        generateValue: true
      # Lấy URL Redis từ service bên dưới
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-cache
          property: connectionString

  - type: redis
    name: agent-cache
    plan: free
    ipAllowList: []   # chỉ cho kết nối nội bộ trong Render
